<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLens AI - ตรวจสอบแคลอรี</title>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
    button { background: #ff6b35; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #e85a24; }
    #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; }
    #result { text-align: left; margin-top: 15px; background: #fffaf7; padding: 15px; border-radius: 12px; display: none; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <h2>🥗 FoodLens AI</h2>
  <p style="color: #666; font-size: 14px;">วิเคราะห์แคลอรีอาหารจากรูปภาพ</p>

  <div style="text-align: left; margin-top: 15px;">
    <label style="font-size: 12px; font-weight: bold; color: #666;">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="วาง API Key ของคุณที่นี่">
  </div>

  <input type="file" id="imageInput" accept="image/*" style="margin-top: 15px;" onchange="previewImage(event)">
  
  <img id="preview" alt="Preview">
  
  <button onclick="analyzeImage()" style="margin-top: 15px;">✨ วิเคราะห์อาหาร</button>

  <div id="loading" style="display:none; margin-top: 15px; color: #ff6b35; font-weight: bold;">⏳ กำลังให้ AI วิเคราะห์...</div>
  <div id="result"></div>
</div>

<script>
  let base64Image = "";
  let mimeType = "image/jpeg";

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      mimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview').style.display = 'block';
        base64Image = e.target.result.split(',')[1];
      }
      reader.readAsDataURL(file);
    }
  }

  async function analyzeImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
      alert("กรุณากรอก Gemini API Key ก่อนครับ");
      return;
    }
    if (!base64Image) {
      alert("กรุณาเลือกรูปภาพอาหารก่อนครับ");
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "วิเคราะห์รูปภาพอาหารนี้ บอกชื่อเมนู, พลังงานรวม (kcal) โดยประมาณ และรายละเอียดสารอาหาร (โปรตีน, คาร์โบไฮเดรต, ไขมัน) เป็นภาษาไทย จัดรูปแบบให้อ่านง่าย" },
              { inline_data: { mime_type: mimeType, data: base64Image } }
            ]
          }]
        })
      });

      const data = await response.json();
      document.getElementById('loading').style.display = 'none';

      if (data.error) {
        alert("Error: " + data.error.message);
        return;
      }

      const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text || "ไม่พบผลลัพธ์";
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "<b>📊 ผลการวิเคราะห์:</b><br>" + outputText.replace(/\n/g, '<br>');
      resultDiv.style.display = 'block';

    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
    }
  }
</script>

</body>
</html>
