<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Food Calorie AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ee;
      color: #203d35;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #66756f;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .upload-box {
      border: 2px dashed #b7d6cc;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      background: #f5fbf8;
    }

    .camera {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #78857f;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      display: inline-block;
      background: #e66f43;
      color: white;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 18px;
      margin-top: 20px;
      display: none;
    }

    .analyze-btn {
      width: 100%;
      border: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #203d35;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .result {
      margin-top: 25px;
      display: none;
    }

    .result h2 {
      margin-bottom: 15px;
    }

    .nutrition {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .nutrition-item {
      background: #f4f8f5;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
    }

    .nutrition-item .icon {
      font-size: 25px;
    }

    .nutrition-item strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    .warning {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #fff7df;
      color: #75632e;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">🍽️</div>
      <h1>Food Calorie AI</h1>
      <p class="subtitle">
        ถ่ายรูปอาหาร แล้วให้ AI ช่วยประเมินโภชนาการ
      </p>
    </div>

    <div class="card">

      <label class="upload-box" for="foodImage">

        <div class="camera">📷</div>

        <div class="upload-title">
          ถ่ายรูปหรือเลือกรูปอาหาร
        </div>

        <div class="upload-text">
          AI จะช่วยวิเคราะห์อาหารในภาพ
        </div>

        <span class="button">
          เลือกรูปอาหาร
        </span>

      </label>

      <input
        id="foodImage"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <img id="preview" alt="Food preview">

      <button class="analyze-btn" id="analyzeBtn">
        🤖 วิเคราะห์อาหาร
      </button>

      <div class="result" id="result">

        <h2>🍛 ผลการวิเคราะห์</h2>

        <p id="foodName">
          ยังไม่ได้วิเคราะห์
        </p>

        <div class="nutrition">

          <div class="nutrition-item">
            <div class="icon">🔥</div>
            <span>Calories</span>
            <strong id="calories">-</strong>
          </div>

          <div class="nutrition-item">
            <div class="icon">💪</div>
            <span>Protein</span>
            <strong id="protein">-</strong>
          </div>

          <div class="nutrition-item">
            <div class="icon">🍚</div>
            <span>Carbs</span>
            <strong id="carbs">-</strong>
          </div>

          <div class="nutrition-item">
            <div class="icon">🥑</div>
            <span>Fat</span>
            <strong id="fat">-</strong>
          </div>

        </div>

        <div class="warning">
          ⚠️ ค่าทางโภชนาการเป็นการประมาณจากภาพ
          อาจมีความคลาดเคลื่อนจากปริมาณอาหาร
          ส่วนผสม วิธีปรุง และขนาดของอาหารจริง
        </div>

      </div>

    </div>

  </div>

  <script>
  const foodImage = document.getElementById("foodImage");
  const preview = document.getElementById("preview");
  const analyzeBtn = document.getElementById("analyzeBtn");

  const result = document.getElementById("result");
  const foodName = document.getElementById("foodName");
  const calories = document.getElementById("calories");
  const protein = document.getElementById("protein");
  const carbs = document.getElementById("carbs");
  const fat = document.getElementById("fat");

  let selectedFile = null;

  // เมื่อเลือกรูป
  foodImage.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    selectedFile = file;

    const imageURL = URL.createObjectURL(file);

    preview.src = imageURL;
    preview.style.display = "block";

    analyzeBtn.style.display = "block";

    result.style.display = "none";

  });


  // เมื่อกดปุ่มวิเคราะห์
  analyzeBtn.addEventListener("click", async function () {

    if (!selectedFile) {
      alert("กรุณาเลือกรูปอาหารก่อน");
      return;
    }

    // เปลี่ยนปุ่มเป็นสถานะกำลังวิเคราะห์
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = "🤖 กำลังวิเคราะห์...";

    result.style.display = "block";

    foodName.textContent = "กำลังให้ AI วิเคราะห์...";
    calories.textContent = "-";
    protein.textContent = "-";
    carbs.textContent = "-";
    fat.textContent = "-";


    try {

      // แปลงรูปเป็น Base64
      const base64Image = await fileToBase64(selectedFile);

      // ส่งข้อมูลไป Cloudflare Worker
      const response = await fetch("/api/analyze", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          image: base64Image,
          mimeType: selectedFile.type
        })

      });


      const data = await response.json();


      // ถ้า API มี error
      if (!response.ok || data.error) {

        console.error(data);

        throw new Error(
          data.error || "ไม่สามารถวิเคราะห์อาหารได้"
        );

      }


      // แสดงผล AI
      foodName.textContent =
        data.foodName || "ไม่ทราบชื่ออาหาร";

      calories.textContent =
        data.calories !== undefined
          ? `${data.calories} kcal`
          : "-";

      protein.textContent =
        data.protein !== undefined
          ? `${data.protein} g`
          : "-";

      carbs.textContent =
        data.carbs !== undefined
          ? `${data.carbs} g`
          : "-";

      fat.textContent =
        data.fat !== undefined
          ? `${data.fat} g`
          : "-";


    } catch (error) {

      console.error(error);

      foodName.textContent =
        "เกิดข้อผิดพลาดในการวิเคราะห์";

      calories.textContent = "-";
      protein.textContent = "-";
      carbs.textContent = "-";
      fat.textContent = "-";

      alert(
        "ไม่สามารถวิเคราะห์อาหารได้\n\n" +
        error.message
      );

    } finally {

      analyzeBtn.disabled = false;
      analyzeBtn.textContent = "🤖 วิเคราะห์อาหาร";

    }

  });


  // แปลงไฟล์รูปเป็น Base64
  function fileToBase64(file) {

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.onload = () => {

        // reader.result จะมีรูปแบบ:
        // data:image/jpeg;base64,XXXXXX

        // เราต้องเอาเฉพาะส่วน Base64
        const base64 = reader.result.split(",")[1];

        resolve(base64);

      };

      reader.onerror = () => {
        reject(
          new Error("ไม่สามารถอ่านไฟล์รูปได้")
        );
      };

      reader.readAsDataURL(file);

    });

  }

    </script>
</body>
</html>
