<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLens AI - ตรวจสอบแคลอรีอาหารด้วย AI</title>
  <style>
    :root {
      --primary: #ff6b35;
      --primary-hover: #e85a24;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 30px 20px;
      text-align: center;
      margin-top: 20px;
    }

    .header-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 30px 20px;
      background: #fafbfc;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      position: relative;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: #fffaf7;
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .upload-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ซ่อน input file แท้จริง แต่ให้กดผ่านกล่องได้ */
    #fileInput {
      display: none;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    /* ส่วนแสดงตัวอย่างรูปภาพที่เลือก */
    #previewContainer {
      display: none;
      margin-bottom: 20px;
    }

    #imagePreview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-icon">🥗</div>
    <h1>FoodLens AI</h1>
    <p class="subtitle">ถ่ายรูปหรือเลือกรูปอาหาร เพื่อให้ AI ช่วยวิเคราะห์แคลอรีและโภชนาการ</p>

    <!-- พื้นสำหรับคลิกเพื่อเลือกรูป -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click();">
      <div class="upload-icon">📷</div>
      <div class="upload-text">แตะเพื่อเลือกรูปภาพอาหาร</div>
      <div class="upload-hint">รองรับไฟล์ JPG, PNG, HEIC</div>
    </div>

    <!-- ฟอร์มเลือกไฟล์จากอุปกรณ์ (เปิดกล้องหรือคลังภาพได้) -->
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="previewImage(event)">

    <!-- ส่วนแสดงรูปที่เลือก -->
    <div id="previewContainer">
      <img id="imagePreview" src="" alt="Preview">
    </div>

    <button class="btn" id="analyzeBtn" style="display: none;" onclick="analyzeFood()">เริ่มวิเคราะห์อาหาร</button>
  </div>

  <footer>
    &copy; 2026 FoodLens AI. All rights reserved.
  </footer>

  <script>
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          
          // แสดงพรีวิวและปุ่มวิเคราะห์
          document.getElementById('previewContainer').style.display = 'block';
          document.getElementById('analyzeBtn').style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    function analyzeFood() {
      alert("ระบบกำลังส่งรูปภาพให้ AI วิเคราะห์โภชนาการ... (สามารถเชื่อมต่อ API ต่อในขั้นตอนนี้ได้เลยครับ)");
    }
  </script>

</body>
</html>
